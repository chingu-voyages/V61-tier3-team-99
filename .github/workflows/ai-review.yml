# .github/workflows/ai-review.yml
name: AI PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]   # + reopened, per the bot
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Review with Gemini
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MAX_DIFF_CHARS: "60000"
        run: |
          set -uo pipefail

          INLINE_MARKER='<!-- ai-review:inline -->'
          SUMMARY_MARKER='<!-- ai-review:summary -->'

          # Upsert (find-and-edit, else create) the one summary comment for
          # this PR so pushes update it in place instead of stacking a new
          # comment every time.
          upsert_summary() {
            local body="$1"
            if [ -n "$EXISTING_SUMMARY_ID" ]; then
              if ! gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING_SUMMARY_ID" -f body="$body" >/dev/null; then
                echo "::warning::Failed to update existing summary comment $EXISTING_SUMMARY_ID"
              fi
            else
              if ! gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null; then
                echo "::warning::Failed to post new summary comment"
              fi
            fi
          }

          # 0. Find any prior summary comment from this workflow, so every
          #    exit path below (error, empty, success) can upsert instead of
          #    spamming a fresh comment on each push.
          EXISTING_SUMMARY_ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login==\"github-actions[bot]\" and (.body // \"\" | contains(\"$SUMMARY_MARKER\")))][0].id // empty")

          # 1. Fetch diff, surfacing the real error (not a generic message)
          if ! gh pr diff "$PR" > diff.txt 2> diff.err; then
            echo "::error::gh pr diff failed: $(cat diff.err)"; exit 1
          fi

          # 2. UTF-8-safe truncation: head -c can split a multibyte char,
          #    so iconv -c drops any trailing partial sequence
          if [ "$(wc -c < diff.txt)" -gt "$MAX_DIFF_CHARS" ]; then
            head -c "$MAX_DIFF_CHARS" diff.txt | iconv -c -f utf-8 -t utf-8 > diff.trimmed
            printf '\n\n[diff truncated for length]\n' >> diff.trimmed
            mv diff.trimmed diff.txt
          fi

          # 3. Build the set of (path, line) pairs that are actually
          #    addressable on the new/RIGHT side of the diff, by walking the
          #    unified-diff hunks ourselves. Used later to drop any comment
          #    that cites a line the diff doesn't actually contain, instead
          #    of letting one bad line reject the whole review.
          awk '
            /^\+\+\+ / {
              file=substr($0, 5)
              sub(/^b\//, "", file)
              next
            }
            /^@@ / {
              match($0, /\+[0-9]+(,[0-9]+)?/)
              spec = substr($0, RSTART+1, RLENGTH-1)
              split(spec, parts, ",")
              newLine = parts[1]
              next
            }
            /^\+/ {
              if (file != "" && file != "/dev/null") print file "\t" newLine
              newLine++
              next
            }
            /^ / {
              if (file != "" && file != "/dev/null") print file "\t" newLine
              newLine++
              next
            }
          ' diff.txt > valid_lines.txt
          jq -R -s 'split("\n") | map(select(length > 0))' valid_lines.txt > valid_keys.json

          # 4. Configurable prompt: use .github/ai-review-prompt.md if it exists
          if [ -f .github/ai-review-prompt.md ]; then
            PROMPT="$(cat .github/ai-review-prompt.md)"
          else
            PROMPT='You are a senior engineer reviewing a pull request. Report only real, specific issues you can support directly from the diff shown below.

          Rules:
          - Every "line" you cite MUST be the exact new-file line number of a line shown in the diff below (a line starting with "+" or a context line). Never invent or estimate a line number.
          - Classify each finding with a "severity" of "high", "medium", or "low".
          - If a fix is a small, mechanical, single-line change, include it verbatim in "suggestion" as the exact replacement text for that one line. Omit "suggestion" (or leave it empty) when the fix is not a clean single-line replacement.
          - You cannot check an external package registry or verify whether a specific library version exists. Do not assert that a dependency, package, or version is invalid, deprecated, or nonexistent — at most note that it looks unusual and is worth double-checking.
          - Also write a short overall "summary" of the change and the review.'
          fi

          # 5. Ask Gemini for STRUCTURED JSON (responseSchema guarantees shape)
          jq -n --arg p "$PROMPT" --rawfile d diff.txt '{
            contents: [{ parts: [{ text: ($p + "\n\n---DIFF---\n\n" + $d) }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "object",
                properties: {
                  summary:  { type: "string" },
                  comments: { type: "array", items: {
                    type: "object",
                    properties: {
                      path:       { type: "string" },
                      line:       { type: "integer" },
                      severity:   { type: "string", enum: ["high", "medium", "low"] },
                      comment:    { type: "string" },
                      suggestion: { type: "string" }
                    },
                    required: ["path","line","severity","comment"]
                  }}
                },
                required: ["summary","comments"]
              }
            }
          }' > body.json

          # 6. Call Gemini (key in header), handle API errors visibly
          HTTP=$(curl -s -w '%{http_code}' -o resp.json -X POST \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent' \
            -d @body.json)
          if [ "$HTTP" != "200" ]; then
            ERR=$(jq -r '.error.message // "Unknown error"' resp.json 2>/dev/null || echo "Unknown error")
            echo "::error::Gemini HTTP $HTTP: $ERR"
            upsert_summary "## 🤖 AI Review (Gemini 2.5 Flash)

          ⚠️ Review skipped — Gemini error (HTTP $HTTP): $ERR

          $SUMMARY_MARKER"
            exit 1
          fi

          # 7. Pull the model's JSON out of the response
          RAW=$(jq -r '.candidates[0].content.parts[0].text // empty' resp.json)
          if [ -z "$RAW" ]; then
            upsert_summary "## 🤖 AI Review (Gemini 2.5 Flash)

          ⚠️ AI review produced no output.

          $SUMMARY_MARKER"
            exit 0
          fi
          echo "$RAW" > review.json
          SUMMARY=$(jq -r '.summary // "AI review"' review.json)

          # 8. Filter comments to ones whose line actually exists in the diff,
          #    dropping (not failing on) the rest.
          TOTAL_COUNT=$(jq '.comments | length' review.json)
          jq --slurpfile vk valid_keys.json '
            ($vk[0] | reduce .[] as $k ({}; .[$k] = true)) as $valid
            | .comments |= map(select(($valid[(.path + "	" + (.line|tostring))] // false)))
          ' review.json > filtered.json
          KEPT_COUNT=$(jq '.comments | length' filtered.json)
          DROPPED_COUNT=$((TOTAL_COUNT - KEPT_COUNT))

          # 9. Render each kept finding as a real inline review comment body:
          #    severity badge + comment + optional ```suggestion block (which
          #    GitHub renders as a native "Commit suggestion" button) + the
          #    hidden marker used to find/delete it on the next push.
          jq '
            .comments |= map(
              . as $c
              | ({high:"🔴 **High**", medium:"🟠 **Medium**", low:"🟡 **Low**"}[$c.severity] // "**Note**") as $badge
              | (
                  $badge + "\n\n" + $c.comment
                  + (if (($c.suggestion // "") | length) > 0
                     then "\n\n```suggestion\n" + $c.suggestion + "\n```"
                     else "" end)
                  + "\n\n<!-- ai-review:inline -->"
                ) as $body
              | { path: $c.path, line: $c.line, side: "RIGHT", body: $body }
            )
          ' filtered.json > comments_final.json

          # 10. Dedupe: delete this bot's prior inline review comments before
          #     posting the fresh set, so re-pushes replace findings instead
          #     of stacking them.
          gh api "repos/$REPO/pulls/$PR/comments" --paginate \
            --jq ".[] | select(.user.login==\"github-actions[bot]\" and (.body // \"\" | contains(\"$INLINE_MARKER\"))) | .id" \
            | while read -r old_id; do
                if [ -n "$old_id" ]; then
                  if ! gh api --method DELETE "repos/$REPO/pulls/comments/$old_id" >/dev/null; then
                    echo "::warning::Failed to delete prior inline comment $old_id — it may remain visible as a stale finding"
                  fi
                fi
              done

          # 11. Post the new review (comments only — no narrative body, so a
          #     stale review never leaves old walkthrough text behind once
          #     its comments are deleted next time; the summary comment below
          #     is the persistent walkthrough).
          if [ "$KEPT_COUNT" -gt 0 ]; then
            jq -n --slurpfile c comments_final.json '{
              body: "Automated review — see the summary comment above for the walkthrough; inline notes below.",
              event: "COMMENT",
              comments: $c[0].comments
            }' > payload.json
            if ! gh api --method POST "repos/$REPO/pulls/$PR/reviews" --input payload.json >/dev/null 2>api.err; then
              echo "::warning::Inline review rejected ($(cat api.err)); findings will only appear in the summary comment"
            fi
          fi

          # 12. Upsert the summary/walkthrough comment.
          NOTE=""
          if [ "$DROPPED_COUNT" -gt 0 ]; then
            NOTE="

          > [!NOTE]
          > $DROPPED_COUNT finding(s) omitted — cited line(s) were not present in the diff."
          fi
          upsert_summary "## 🤖 AI Review (Gemini 2.5 Flash)

          $SUMMARY$NOTE

          $SUMMARY_MARKER"
