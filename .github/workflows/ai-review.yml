# .github/workflows/ai-review.yml
name: AI PR Review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Review with Gemini
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
          MAX_DIFF_CHARS: "60000"
        run: |
          set -uo pipefail   # not -e, so we handle failures ourselves

          # 1. Fetch diff — fail loudly if this breaks
          if ! gh pr diff "$PR" > diff.txt; then
            echo "::error::Failed to fetch PR diff"; exit 1
          fi

          # 2. Guard against oversized diffs
          TRUNCATED=false
          if [ "$(wc -c < diff.txt)" -gt "$MAX_DIFF_CHARS" ]; then
            head -c "$MAX_DIFF_CHARS" diff.txt > diff.trimmed
            printf '\n\n[diff truncated for length]\n' >> diff.trimmed
            mv diff.trimmed diff.txt
            TRUNCATED=true
          fi

          # 3. Build request body safely (jq handles all escaping)
          PROMPT='You are a senior engineer reviewing a pull request. Review the diff and respond in Markdown with three short sections: **Bugs**, **Security**, **Suggestions**. List only real, specific issues; if a section has none, write "None found." Be concise and reference code where relevant.'
          jq -n --arg p "$PROMPT" --rawfile d diff.txt \
            '{contents:[{parts:[{text:($p + "\n\n---\n\n" + $d)}]}]}' > body.json

          # 4. Call Gemini via header (not URL), capture HTTP status
          HTTP=$(curl -s -w '%{http_code}' -o resp.json -X POST \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent' \
            -d @body.json)

          # 5. Handle API errors with a visible comment instead of silence
          if [ "$HTTP" != "200" ]; then
            ERR=$(jq -r '.error.message // "Unknown error"' resp.json 2>/dev/null || echo "Unknown error")
            echo "::error::Gemini HTTP $HTTP: $ERR"
            gh pr comment "$PR" --body "⚠️ AI review skipped — Gemini error (HTTP $HTTP): $ERR"
            exit 1
          fi

          # 6. Extract text; handle empty / blocked responses
          REVIEW=$(jq -r '.candidates[0].content.parts[0].text // empty' resp.json)
          if [ -z "$REVIEW" ]; then
            REASON=$(jq -r '.promptFeedback.blockReason // "empty response"' resp.json)
            gh pr comment "$PR" --body "⚠️ AI review produced no output ($REASON)."
            exit 0
          fi

          # 7. Post the review
          {
            echo "## 🤖 AI Review (Gemini 2.5 Flash)"
            [ "$TRUNCATED" = "true" ] && echo "_Note: the diff was large and was truncated before review._"
            echo
            echo "$REVIEW"
          } > review.md
          gh pr comment "$PR" --body-file review.md
